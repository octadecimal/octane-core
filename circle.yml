machine:
  pre:
    - sudo add-apt-repository ppa:haxe/releases -y
    - sudo apt-get update
    - sudo apt-get install haxe -y
    - sudo apt-get install phantomjs -y
    - mkdir ~/haxelib && haxelib setup ~/haxelib
    - git clone https://github.com/jgranick/MassiveUnit ~/munit
    - haxelib dev munit ~/munit/src
    - cd ~/munit/tool
    - ls ~ -al
    - ls ~/munit -al
    - ls ~/munit/tool -al
    - haxe ~/munit/tool/build.hxml

test:
  override:
    - haxe run-tests-ci.hxml